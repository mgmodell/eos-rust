name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Run unit tests
        run: cargo test --features ssr
        env:
          SQLX_OFFLINE: "true"

  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          targets: wasm32-unknown-unknown

      - name: Install cargo-leptos
        run: cargo install cargo-leptos --locked

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: end2end/package-lock.json

      - name: Install Playwright dependencies
        working-directory: end2end
        run: npm ci

      - name: Install system dependencies for Playwright
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2t64

      - name: Install Playwright browsers
        working-directory: end2end
        run: npx playwright install --with-deps chromium

      - name: Build application
        run: cargo leptos build --release
        env:
          SQLX_OFFLINE: "true"

      - name: Start server and run e2e tests
        run: |
          ./target/release/eos-rust &
          SERVER_PID=$!
          # Wait for the server to be ready
          for i in $(seq 1 30); do
            if curl -s http://localhost:3000/ > /dev/null; then
              break
            fi
            sleep 1
          done
          if ! curl -s http://localhost:3000/ > /dev/null; then
            echo "Server did not start within 30 seconds"
            kill -9 $SERVER_PID || true
            exit 1
          fi
          cd end2end && npx playwright test --project=chromium
          EXIT_CODE=$?
          kill -9 $SERVER_PID || true
          exit $EXIT_CODE
        env:
          LEPTOS_OUTPUT_NAME: eos-rust
          LEPTOS_SITE_ROOT: target/site
          LEPTOS_SITE_PKG_DIR: pkg
          LEPTOS_SITE_ADDR: "127.0.0.1:3000"
          LEPTOS_ENV: PROD
          DATABASE_URL: "sqlite:eos.db"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: end2end/playwright-report/
          retention-days: 30
